[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=42",
  "setuptools-scm[toml]>=3.4",
  "wheel",
]

[project]
name = "oceanarray"
description = "Multi-stage processing pipeline for moored oceanographic observations: raw instrument files to QC-flagged CF-compliant NetCDF with automated HTML reports."
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Eleanor Frajka-Williams", email = "eleanorfrajka@gmail.com" },
]
requires-python = ">=3.11"
keywords = [
  "oceanography",
  "mooring",
  "ADCP",
  "CTD",
  "NetCDF",
  "QC",
  "oceanographic-data",
  "AMOC",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Oceanography",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "xarray>=2023.12.0",
  "netcdf4>=1.6",         # xarray NetCDF read/write engine (used implicitly, no direct import)
  "scipy>=1.10",
  "matplotlib>=3.10",     # boxplot(orientation=) in the by-deployment panels (added 3.10)
  "pillow>=9.0",          # report figure PNG palette-quantization in _fig_to_base64
  "gsw>=3.6.16",          # seawater properties (TEOS-10)
  "ppigrf",               # IGRF magnetic declination (stage3 BEAM->ENU correction)
  "ioos_qc",              # QARTOD QC tests
  "pycwt",                # wavelet analysis (grid report temperature scalogram)
  "seasenselib",          # raw instrument-file readers (stage 1); pulls mhkit[dolfyn] for RDI
  "jinja2>=3.0",          # template rendering (reports)
  "ruamel.yaml>=0.18",    # YAML stub generation (preserves inline comments)
  "packaging>=23",        # oceanarray_version comparisons (provenance.requires_version)
]
dynamic = [
  "version",
]
urls.Documentation = "https://ocean-uhh.github.io/oceanarray"
urls.Homepage = "https://github.com/ocean-uhh/oceanarray"
urls.Repository = "https://github.com/ocean-uhh/oceanarray"
urls."Issue Tracker" = "https://github.com/ocean-uhh/oceanarray/issues"

[project.optional-dependencies]
# PDF report output (oceanarray report --pdf). WeasyPrint pulls in native
# libraries (pango, cairo, gdk-pixbuf) so it is kept out of the core install.
pdf = [
  "weasyprint>=60",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
]
docs = [
  "sphinx>=7.2",
  "sphinx-rtd-theme>=2.0",
  "sphinx-argparse>=0.4",   # CLI reference generated from cli.build_parser()
  "myst-nb>=1.0",
  "nbsphinx>=0.9",
  "pypandoc>=1.11",
]
# Everything a contributor needs for code+tests+docs: core runtime deps (incl.
# seasenselib) + test + docs + tooling.  One command: `pip install -e ".[dev]"`.
# ``pdf`` is deliberately
# NOT included — WeasyPrint's native libraries (pango/cairo) are fragile across
# platforms, so PDF work uses `pip install -e ".[dev,pdf]"`.
dev = [
  "oceanarray[test,docs]",
  "ruff>=0.3",
  "import-linter>=2.0",
  "jupyterlab>=4.0",
  "nbconvert>=7.8",
]
# Everything, including the native-library-dependent pdf extra. Shorthand for
# `.[dev,pdf]`; opt-in only (not used in CI, which stays pdf-free).
all = [
  "oceanarray[dev,pdf]",
]


[project.scripts]
oceanarray = "oceanarray.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["oceanarray", "oceanarray.*"]

[tool.setuptools.package-data]
oceanarray = [
  "config/*.yaml",
  "config/legacy/*.yaml",
  "reports/templates/*.html",   # report page templates loaded via FileSystemLoader
  # Vendored report-design layer (byte-identical from ctdcast): the mplstyle
  # (MPLSTYLE_PATH resolves it at runtime), shared template macros, the offline
  # Leaflet assets, and the self-check's MANIFEST.txt / README.md.
  "reports/_vendored/*.mplstyle",
  "reports/_vendored/*.txt",
  "reports/_vendored/*.md",
  "reports/_vendored/templates/*",
  "reports/_vendored/leaflet/*",
]

[tool.setuptools_scm]
write_to = "oceanarray/_version.py"
write_to_template = "__version__ = '{version}'"
tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.check-manifest]
ignore = [
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: takes more than ~5 s even with synthetic data (excluded from CI; run with -m slow)",
  "local: requires developer-machine context (mounted volumes, GUIs, instrument-specific paths); never on CI",
]

[tool.coverage.run]
source = ["oceanarray"]
branch = true
omit = [
  "oceanarray/legacy/*",
  "oceanarray/plotters/_cli_legacy.py",  # legacy CLI plots; deleted when oceanarray plot <file> redesign lands
  "oceanarray/pipeline/clock/*",         # unfinished modules; testing would freeze an interface intended to change
  "oceanarray/_version.py",              # generated by setuptools-scm
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
  "oceanarray/legacy",   # legacy modules — not maintained to current standards
  "notebooks",           # notebooks are exploratory; not held to production lint standards
  "docs",                # Sphinx conf and vendored third-party code
]

[tool.ruff.lint]
# Family reference: ctdcast's ruff configuration (repo-hygiene checklist, 2026-09-08).
select = [
  "E",       # pycodestyle errors
  "F",       # pyflakes
  "W",       # pycodestyle warnings
  "B",       # flake8-bugbear
  "BLE",     # flake8-blind-except
  "ARG",     # flake8-unused-arguments
  "D",       # pydocstyle
  "ANN",     # flake8-annotations
  "I",       # isort
  "UP",      # pyupgrade
  "C4",      # flake8-comprehensions
  "RET",     # flake8-return
  "PIE",     # flake8-pie
  "SIM",     # flake8-simplify
  "NPY",     # numpy-specific rules
  "PTH",     # flake8-use-pathlib
  "RUF100",  # unused noqa directives
]
extend-select = ["D417"]  # numpy convention drops D417 (undocumented params); we want it
ignore = [
  "D107",    # missing docstring in __init__
  "E501",    # line length — ruff format owns wrapping
  "ANN401",  # typing.Any is allowed — common in dataset/xarray helper signatures
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"   # handles D203 / D213 itself — do not hand-ignore those

[tool.ruff.lint.per-file-ignores]
# NPY002: test scaffolding may use legacy np.random (synthetic data); not production numpy.
"tests/**" = ["ANN", "D", "NPY002"]   # tests: no type annotations / docstrings; legacy RNG ok
"tests/legacy/**" = ["ANN", "D", "ARG001", "E741", "F841"]  # legacy tests: unused fixture args, short var names, unused locals
"oceanarray/pipeline/clock/*" = ["ANN", "D"]  # unfinished modules (clock analysis, deployment detection); interface will change (backlog)
"oceanarray/plotters/_cli_legacy.py" = ["ANN", "D"]  # legacy CLI plots; deleted when the plot redesign lands
"oceanarray/plotters/__init__.py" = ["ANN", "D", "F401"]  # backward-compat shim re-exports
"oceanarray/pipeline/gridders/rapid_interp.py" = ["ANN", "D", "F841", "BLE001"]  # legacy physics code; rewrite deferred (backlog)
# Report generators wrap rendering in try/except → None on bad data (partial reports).
"oceanarray/reports/_plots.py" = ["BLE001"]
# Vendored byte-identical from ctdcast (source of truth); re-vendored, never edited here.
# RUF100 (noqa managed upstream) and the docstring/annotation rules are off so oceanarray's
# linter cannot force an edit that diverges from ctdcast/glidertest. Mirrors ctdcast's config.
"oceanarray/reports/_vendored/*" = ["RUF100", "D", "ANN"]
"oceanarray/reports/_html_helpers.py" = ["BLE001"]
"oceanarray/reports/_read.py" = ["BLE001"]
"oceanarray/reports/_grid.py" = ["BLE001"]
"oceanarray/reports/_instrument.py" = ["BLE001", "ARG001"]
"oceanarray/reports/_mooring.py" = ["BLE001"]
"oceanarray/reports/_stack.py" = ["BLE001", "ARG001", "F841"]

# Which part of the package may import which (docs/source/developer.rst, section 2).
# Run with ``lint-imports``. Each ignored import marked "To change" is a known
# exception listed in the developer guide's "To change" table: delete its line in
# the pull request that removes the import, so the list only shrinks. "Nothing
# outside legacy imports legacy" stays a test (tests/unit/test_package_boundaries.py),
# which covers every module, including new ones.
[tool.importlinter]
root_package = "oceanarray"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layers: each part imports only the parts below it"
type = "layers"
layers = [
  "oceanarray.cli",
  "oceanarray.reports",
  "oceanarray.plotters",
  "oceanarray.analysis",
  "oceanarray.pipeline",
  "oceanarray.readers : oceanarray.writers",
  "oceanarray.mooring : oceanarray.catalog : oceanarray.provenance : oceanarray.logger : oceanarray.paths : oceanarray.instruments : oceanarray.location : oceanarray.physics : oceanarray.inspect",
  "oceanarray.config : oceanarray.exceptions : oceanarray._deprecated",
]
ignore_imports = [
  # The shared report layer is a foundation: every part may use its tokens and units.
  "oceanarray.** -> oceanarray.reports._vendored.**",
  # The package version, read from the package root.
  "oceanarray.provenance -> oceanarray",
  # To change, and a cycle (mooring imports config.validation back): mooring-YAML
  # validation belongs above the modules it checks against.
  "oceanarray.config.validation -> oceanarray.mooring",
  "oceanarray.config.validation -> oceanarray.paths",
  "oceanarray.config.validation -> oceanarray.instruments",
  # To change, and a cycle (pipeline.stack and pipeline.concat import mooring): the
  # mooring YAML reads pipeline helpers and defaults; those pieces move below mooring.
  "oceanarray.mooring -> oceanarray.pipeline.attribution",
  "oceanarray.mooring -> oceanarray.pipeline.masking",
  "oceanarray.mooring -> oceanarray.pipeline._run",
  # To change: readers use pipeline helpers (they move below the readers).
  "oceanarray.readers.rodb -> oceanarray.pipeline.pressure",
  "oceanarray.readers.oceansites -> oceanarray.pipeline.pressure",
  "oceanarray.readers.oceansites -> oceanarray.pipeline._stage",
  "oceanarray.readers.oceansites -> oceanarray.pipeline.qc.originator",
  # To change: the sensor catalog uses the originator flag table.
  "oceanarray.catalog -> oceanarray.pipeline.qc.originator",
  # To change: provenance compares attributes with a writer helper.
  "oceanarray.provenance -> oceanarray.writers.dtypes",
  # run ends with the report (section 2).
  "oceanarray.pipeline._run -> oceanarray.reports",
]

[[tool.importlinter.contracts]]
name = "The shared report layer stands alone (it is copied from ctdcast)"
type = "forbidden"
source_modules = ["oceanarray.reports._vendored"]
# Every other part of the package, by name: the package root and reports/ cannot be
# listed whole, since they hold the source. A new module is added here.
forbidden_modules = [
  "oceanarray.analysis", "oceanarray.cli", "oceanarray.config", "oceanarray.pipeline",
  "oceanarray.plotters", "oceanarray.readers", "oceanarray.writers",
  "oceanarray.reports._array", "oceanarray.reports._breadcrumb",
  "oceanarray.reports._captions", "oceanarray.reports._concat",
  "oceanarray.reports._env", "oceanarray.reports._figdebug", "oceanarray.reports._grid",
  "oceanarray.reports._gridcat", "oceanarray.reports._html_helpers",
  "oceanarray.reports._instrument", "oceanarray.reports._instrument_text",
  "oceanarray.reports._masthead", "oceanarray.reports._mooring",
  "oceanarray.reports._navs", "oceanarray.reports._pdf", "oceanarray.reports._plots",
  "oceanarray.reports._qcflags", "oceanarray.reports._read",
  "oceanarray.reports._recovery_table", "oceanarray.reports._slots",
  "oceanarray.reports._stack", "oceanarray.reports._summary",
  "oceanarray.reports._verb", "oceanarray.reports.design",
  "oceanarray.mooring", "oceanarray.paths", "oceanarray.logger", "oceanarray.catalog",
  "oceanarray.provenance", "oceanarray.instruments", "oceanarray.location",
  "oceanarray.physics", "oceanarray.inspect", "oceanarray.exceptions",
  "oceanarray._deprecated", "oceanarray.legacy",
]

[[tool.importlinter.contracts]]
name = "Units have one door: pipeline code gets the unit tables through config.unit_tables"
type = "forbidden"
source_modules = ["oceanarray.pipeline"]
forbidden_modules = ["oceanarray.reports._vendored.units", "oceanarray.reports._vendored.units_tables"]
# Indirect imports are allowed: config.unit_tables is the door, and it reads the shared units.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Plotters import no page module directly (the shared report layer excepted)"
type = "forbidden"
source_modules = ["oceanarray.plotters"]
forbidden_modules = ["oceanarray.reports"]
# Direct imports only for now: indirect chains still reach the pages through the
# mooring <-> pipeline cycle (pipeline._run ends with the report).
allow_indirect_imports = true
ignore_imports = ["oceanarray.plotters.** -> oceanarray.reports._vendored.**"]
