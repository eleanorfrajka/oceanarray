name: Run tests

on:
  push:
    branches: [main]      # post-merge on main only
  pull_request:           # every PR (branch pushes run here, not twice)

# Cancel superseded runs when a branch/PR is pushed again in quick succession.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    # Any leg marked experimental is allowed to fail without cancelling real jobs.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]     # full 3-OS coverage on the primary version
        include:
          # Verify the supported range (requires-python >=3.11; docs say 3.11–3.13),
          # ubuntu-only to keep the job count down.
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          # Forward-looking probe for 3.14: allowed to fail (experimental) so a
          # dependency not yet 3.14-ready does not block the required check. Not
          # in the supported range / pyproject classifiers yet.
          - { os: ubuntu-latest, python-version: "3.14", experimental: true }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.experimental == true }}
          cache: "pip"

      - name: Install oceanarray (test extra = runtime + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests
        # Coverage gate runs once, on the canonical ubuntu + 3.11 leg; the extra
        # version legs run --no-cov so they only verify install + test pass.
        env:
          # Windows: the netCDF4 wheel points HDF5_PLUGIN_PATH at its bundled plugins
          # folder, and HDF5 rescans it on every filter query -- xarray calls
          # var.filters() once per variable, so each NETCDF4 open costs ~36 ms/variable
          # on the hosted runner. "::" preloads no plugins. oceanarray writes zlib
          # (built into HDF5), so only zstd/bzip2/blosc files would need them -- none
          # here. No effect on Linux/macOS.
          HDF5_PLUGIN_PRELOAD: "::"
        run: >
          pytest tests/unit -m "not slow and not local" -q
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') && '--cov=oceanarray --cov-report=term-missing --cov-fail-under=58' || '--no-cov' }}

      - name: Run docstring examples (doctest)
        run: pytest --doctest-modules oceanarray --ignore=oceanarray/legacy -q --no-cov -p no:cacheprovider

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # seasenselib is a core dependency, so the golden integration tests
      # (stage2/stage3/grid) run for real here rather than skipping.
      - name: Install oceanarray (test extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run integration tests
        run: pytest tests/integration -m "not local" -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm reads the version from the tags

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      # From outside the checkout, so only the installed wheel can be imported.
      - name: Install it in a fresh env and open every packaged data file
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/python -m oceanarray.reports._vendored.check
          wheel-env/bin/python - <<'EOF'
          import matplotlib.pyplot as plt

          import oceanarray
          from oceanarray.config import parameters as params
          from oceanarray.logger import load_logging_config
          from oceanarray.pipeline.qc.originator import vocabulary
          from oceanarray.reports._env import _ENV
          from oceanarray.reports._vendored.leaflet import load_leaflet

          assert "site-packages" in oceanarray.__file__, oceanarray.__file__
          load_logging_config()
          vocabulary()
          load_leaflet()
          plt.style.use(str(params.MPLSTYLE))
          for name in _ENV.list_templates():
              _ENV.get_template(name)
          EOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ruff and import-linter
        run: pip install ruff import-linter

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Import rules (lint-imports, contracts in pyproject.toml)
        run: PYTHONPATH=. lint-imports
